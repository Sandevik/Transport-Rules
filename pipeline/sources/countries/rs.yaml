country: Serbia
code: rs
eu_member: false
eea_member: false
aetr_signatory: true
eu_candidate: true
framework_tier: 2
currency: RSD
notes: >
  AETR signatory and EU accession candidate country. AETR governs driving/rest time
  and tachographs. Serbia is progressively aligning with EU transport acquis but formal
  EU membership has not yet occurred — EU baseline regulations are not directly applicable.
  Key transit country on the E75 corridor (Hungary → Serbia → North Macedonia → Greece).
  CEMT/ITF multilateral permits or bilateral permits required for road freight.

