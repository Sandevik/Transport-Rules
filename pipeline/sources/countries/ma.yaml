country: Morocco
code: ma
eu_member: false
eea_member: false
aetr_signatory: true
framework_tier: 2
currency: MAD
notes: >
  AETR signatory. AETR governs driving/rest time and tachographs for international
  road transport to/from Morocco. Morocco has an EU Association Agreement and Advanced
  Status. Road freight between EU and Morocco typically uses ferry crossings
  (Spain-Morocco via Algeciras-Tanger Med or Almería-Nador). Bilateral permits
  required; CEMT/ITF permits generally valid.

