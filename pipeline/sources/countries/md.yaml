country: Moldova
code: md
eu_member: false
eea_member: false
aetr_signatory: true
eu_candidate: true
framework_tier: 2
currency: MDL
notes: >
  AETR signatory and EU candidate (since June 2022). AETR governs driving/rest time
  and tachographs. Key transit corridor for EU-Ukraine freight. Moldova has an
  EU Association Agreement and Deep and Comprehensive Free Trade Area (DCFTA).
  Some EU transport regulations are being progressively adopted. Verify current
  bilateral EU-MD transport arrangements for up-to-date permit requirements.

