country: Georgia
code: ge
eu_member: false
eea_member: false
aetr_signatory: true
eu_candidate: true
framework_tier: 2
currency: GEL
notes: >
  AETR signatory and EU candidate (since December 2023). AETR governs driving/rest
  time and tachographs. Key country on the Middle Corridor (Trans-Caspian International
  Transport Route) linking Europe to Central Asia/China via Azerbaijan-Caspian-Kazakhstan
  or Georgia-Armenia-Iran. EU-Georgia Association Agreement and DCFTA in force.

