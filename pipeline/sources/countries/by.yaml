notes: >
  AETR signatory. AETR governs driving/rest time and tachographs.
  WARNING: EU/UK/US sanctions apply to Belarus since 2021–2022. Road transport between
  the EU and Belarus has been severely restricted. Belarusian carriers are largely
  prohibited from operating in the EU (Council Regulation 2022/576). Verify current
  sanctions status before any operations involving Belarus.

