eu_member: true
eea_member: true
aetr_signatory: true
framework_tier: 1
currency: SEK
authorities:
  primary: Transportstyrelsen
  primary_url: https://www.transportstyrelsen.se/en/
notes: 'EU member state and AETR signatory. EU baseline regulations apply for driving/rest,
  tachograph, and most professional transport topics. Sweden has significant national
  legislation covering BK road-bearing classes, long vehicle combinations (EMS/LCV
  up to 34.5m), transport dispensation, professional driver competence, taxi rules,
  company control requirements, and environmental law (Miljöbalken). Swedish national
  rules often exceed EU minimums.

  '
