country: Bosnia-Herzegovina
code: ba
eu_member: false
eea_member: false
aetr_signatory: true
eu_candidate: true
framework_tier: 2
currency: BAM
notes: >
  AETR signatory and EU accession candidate. AETR governs driving/rest time and tachographs.
  Complex administrative structure (Federation of BiH + Republika Srpska entities).
  Key transit country on the Western Balkans route. CEMT/ITF multilateral permits
  or bilateral permits required. Road network quality varies; check route restrictions
  for heavy vehicles.

