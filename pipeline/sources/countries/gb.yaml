notes: 'Post-Brexit. Retained EU 561/2006 as GB domestic law via EU Withdrawal Act
  2018. No longer subject to EU regulation updates (Mobility Package provisions may
  differ). Completely standalone from EU enforcement network and ERRU risk rating
  system.

  '
