description: AETR Agreement baseline sources — for Tier 2 countries (non-EU/EEA AETR signatories)
code: aetr
country: AETR (UNECE)
framework_tier: 2
notes: >
  AETR governs driving/rest time, tachographs, crew requirements, enforcement,
  and sanctions for international road transport crossing non-EU AETR contracting parties.
  All other topics (vehicle dimensions, ADR, professional driver CPC, road charging,
  commercial licensing, posting of workers) are standalone national rules for AETR-only countries.

