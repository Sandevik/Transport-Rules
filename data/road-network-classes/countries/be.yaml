jurisdiction: BE
topic: road-network-classes
regulation: "Arrêté royal du 2 juin 2010 relatif au transport exceptionnel; Arrêté royal du 1 décembre 1975 (Code de la Route)"
last_verified: "2026-05-31"
source_url: "https://mobilit.belgium.be/fr/transport_terrestre/transport_exceptionnel"
inherits_from: null

system_name: "Belgian Exceptional Transport Categories"
description: "Belgium uses a permit-based system for transport exceeding standard limits. Standard EU limits apply on motorways and main roads (up to 44t). Exceptional transport categories apply above these limits."

standard_transport:
  max_gvw_t: 44              # Belgium allows 44t on motorways (EU combined transport bonus applied broadly)
  max_length_m: 18.75
  max_width_m: 2.55
  max_height_m: 4.0

exceptional_transport:
  category_standard_exceptional:
    max_gvw_t: 90
    max_width_m: 3.5
    max_height_m: 4.8
    max_length_m: 30.0
    requirements: "Permit from SPF Mobilité; approved secondary roads; pilot vehicle required if ≥90t or >3.5m width"
    permit_url: "https://mobilit.belgium.be/fr/transport_terrestre/transport_exceptionnel"
  category_heavy:
    max_gvw_t: null          # no hard cap
    requirements: "Detailed permit; police escort; route survey; advance notice"
    authority: "SPF Mobilité et Transports + regional road authorities"

pilot_vehicle_requirements:
  required_when_width_m_over: 3.5
  required_when_gvw_t_over: 90
  note: "Police escort required for very heavy or wide loads; arranged via permit authority"

weekend_bans:
  applies_to: "Vehicles >7.5t"
  friday_pm: "14:00–22:00 in July/August (seasonal)"
  saturdays: "07:00–22:00 (seasonal restrictions)"
  sundays_holidays: "00:00–22:00"
  note: "See annual schedule from SPF Mobilité — varies by year and season"

posting_declaration:
  system: "Limosa (online declaration portal)"
  url: "https://www.limosa.be"
  required_for: "Foreign drivers performing cabotage or posting in Belgium"
