name: vehicle-classes
description: EU vehicle category taxonomy shared across inspection, dimensions-weights, and tachograph topics
metadata:
  type: reference
  regulation: "Directive 2007/46/EC (framework); superseded by 2018/858/EU"
  last_verified: "2026-05-31"
  source_url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32018R0858"
