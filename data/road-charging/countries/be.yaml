notes: >
  Rates effective 1 January 2026, sourced from viapass.be official rate table.
  Wallonia rates are ex-VAT (subject to Belgian VAT); Flanders and Brussels rates
  are taxes (VAT-exempt). The Belgian km-charge applies on all public roads, not
  just motorways — making it one of the widest-coverage systems in Europe.
  GVW is total vehicle+trailer weight.
